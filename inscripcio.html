
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badalona Tech 2027 - Inscripció</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Badalona Tech 2027</h1>
        <p>Fira de tecnologia, informació i innovació</p>
    </header>

    <nav>
        <a href="index.html">Inici</a>
        <a href="activitats.html">Activitats</a>
        <a href="horaris.html">Horaris</a>
        <a href="inscripcio.html">Inscripció</a>
    </nav>

    <main>

        <h2>Inscripció a la fira</h2>
        <span><img src="images/clip.svg" alt="Logo clip"></span>

        <p>
            Omple el formulari per inscriure't a la
            Badalona Tech 2027.
        </p>

        <form action="#" method="post">

            <fieldset>

                <legend>Dades personals</legend>

                <p>
                    <label for="nom">Nom complet:</label>
                    <input type="text" id="nom" name="nom" required>
                </p>

                <p>
                    <label for="correu">Correu electrònic:</label>
                    <input type="email" id="correu" name="correu" required>
                </p>

                <p>
                    <label for="telefon">Telèfon:</label>
                    <input type="tel" id="telefon" name="telefon">
                </p>

            </fieldset>

            <fieldset>

                <legend>Preferències</legend>

                <p>
                    <label for="activitat">Activitat:</label>

                    <select id="activitat" name="activitat" required>

                        <option value="">Selecciona una activitat</option>

                        <option value="robotica">Taller de robòtica</option>

                        <option value="ciberseguretat">Introducció a la ciberseguretat</option>

                        <option value="web">Crea la teva primera web</option>

                    </select>
                </p>

                <p>Dia d'assistència:</p>

                <p>
                    <input type="radio" id="dissabte" name="dia" value="dissabte" required>
                    <label for="dissabte">Dissabte</label>
                </p>

                <p>
                    <input type="radio" id="diumenge" name="dia" value="diumenge">
                    <label for="diumenge">Diumenge</label>
                </p>

                <p>
                    <label for="observacions">Observacions:</label>
                </p>

                <p>
                    <textarea id="observacions" name="observacions" rows="5" cols="40"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="informacio" name="informacio">
                    <label for="informacio">Vull rebre informació de futures activitats</label>
                </p>

                <p>
                    <input type="checkbox" id="condicions" name="condicions" required>
                    <label for="condicions">Accepto les condicions</label>
                </p>

            </fieldset>

            <p>
                <input type="submit" value="Enviar inscripció">
                <input type="reset" value="Netejar">
            </p>

        </form>

    </main>

    <footer>
        <p>Badalona Tech 2027 - Portal informatiu</p>

        <p>
            <img src="images/correu.svg" alt="Logo del correu">
            <a href="mailto:info@badalonatech.cat">
                info@badalonatech.cat
            </a>
        </p>
    </footer>

</body>
</html>
